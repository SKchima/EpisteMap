<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Main Sigma Path Gradient -->
    <linearGradient id="sigmaEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="55%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Secondary Semantic Graph Edge Gradient -->
    <linearGradient id="semanticEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.75" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nexusGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Gradients -->
    <radialGradient id="nodeGradPrimary" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </radialGradient>

    <radialGradient id="nodeGradNexus" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#bae6fd" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <radialGradient id="nodeGradSub" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#d946ef" />
    </radialGradient>

    <radialGradient id="nodeGradCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />
  
  <!-- Sleek Inner Border Accent -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ambientGlow)" />

  <!-- Epistemic Blueprint Grid (Fine dashed lines) -->
  <g opacity="0.10" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,6">
    <line x1="80" y1="135" x2="432" y2="135" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="377" x2="432" y2="377" />
    <line x1="145" y1="80" x2="145" y2="432" />
    <line x1="210" y1="80" x2="210" y2="432" />
    <line x1="375" y1="80" x2="375" y2="432" />
  </g>

  <!-- INTERNAL GRAPH NETWORK (Constellation of Concepts inside Σ) -->
  <g stroke="url(#semanticEdge)" stroke-width="3" stroke-linecap="round">
    <!-- Nexus (210, 256) to S1 (300, 195) -->
    <line x1="210" y1="256" x2="300" y2="195" />
    <!-- Nexus (210, 256) to S2 (300, 317) -->
    <line x1="210" y1="256" x2="300" y2="317" />
    <!-- Horizontal Episteme spine: Nexus (210, 256) to Core (335, 256) -->
    <line x1="210" y1="256" x2="335" y2="256" stroke-dasharray="6,4" />
    
    <!-- Triangulation between constellation nodes -->
    <line x1="300" y1="195" x2="335" y2="256" opacity="0.6" />
    <line x1="300" y1="317" x2="335" y2="256" opacity="0.6" />
    <line x1="300" y1="195" x2="300" y2="317" stroke-dasharray="4,6" opacity="0.35" />

    <!-- Links from sub-nodes to Σ corners -->
    <line x1="300" y1="195" x2="375" y2="135" stroke-dasharray="5,5" opacity="0.5" />
    <line x1="300" y1="195" x2="145" y2="135" stroke-dasharray="4,6" opacity="0.3" />
    <line x1="300" y1="317" x2="375" y2="377" stroke-dasharray="5,5" opacity="0.5" />
    <line x1="300" y1="317" x2="145" y2="377" stroke-dasharray="4,6" opacity="0.3" />
  </g>

  <!-- PRIMARY SIGMA (Σ) STRUCTURAL EDGES -->
  <!-- Outer Glow Halo for the main Σ path -->
  <path d="M 145 135 L 375 135 L 210 256 L 375 377 L 145 377"
        fill="none"
        stroke="#818cf8"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.22"
        filter="url(#glow)" />

  <!-- Core Sharp Gradient Stroke of Σ -->
  <path d="M 145 135 L 375 135 L 210 256 L 375 377 L 145 377"
        fill="none"
        stroke="url(#sigmaEdge)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- INTERNAL CONSTELLATION GRAPH NODES -->
  <!-- Sub-node S1 (Upper Knowledge Cluster) -->
  <g filter="url(#glow)">
    <circle cx="300" cy="195" r="14" fill="#0f172a" stroke="#d946ef" stroke-width="3" />
    <circle cx="300" cy="195" r="7.5" fill="url(#nodeGradSub)" />
  </g>

  <!-- Sub-node S2 (Lower Knowledge Cluster) -->
  <g filter="url(#glow)">
    <circle cx="300" cy="317" r="14" fill="#0f172a" stroke="#d946ef" stroke-width="3" />
    <circle cx="300" cy="317" r="7.5" fill="url(#nodeGradSub)" />
  </g>

  <!-- Core Concept Node (Center-Right E-Spine Focus) -->
  <g filter="url(#glow)">
    <circle cx="335" cy="256" r="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2.8" />
    <circle cx="335" cy="256" r="6" fill="url(#nodeGradCyan)" />
  </g>

  <!-- 5 MAIN STRUCTURAL NODES OF SIGMA (Σ) -->
  <!-- Node 1: Top-Left (145, 135) -->
  <g filter="url(#glow)">
    <circle cx="145" cy="135" r="19" fill="#090d16" stroke="#38bdf8" stroke-width="4" />
    <circle cx="145" cy="135" r="10" fill="url(#nodeGradPrimary)" />
    <circle cx="145" cy="135" r="3" fill="#ffffff" />
  </g>

  <!-- Node 2: Top-Right (375, 135) -->
  <g filter="url(#glow)">
    <circle cx="375" cy="135" r="19" fill="#090d16" stroke="#818cf8" stroke-width="4" />
    <circle cx="375" cy="135" r="10" fill="url(#nodeGradPrimary)" />
    <circle cx="375" cy="135" r="3" fill="#ffffff" />
  </g>

  <!-- Node 4: Bottom-Right (375, 377) -->
  <g filter="url(#glow)">
    <circle cx="375" cy="377" r="19" fill="#090d16" stroke="#818cf8" stroke-width="4" />
    <circle cx="375" cy="377" r="10" fill="url(#nodeGradPrimary)" />
    <circle cx="375" cy="377" r="3" fill="#ffffff" />
  </g>

  <!-- Node 5: Bottom-Left (145, 377) -->
  <g filter="url(#glow)">
    <circle cx="145" cy="377" r="19" fill="#090d16" stroke="#38bdf8" stroke-width="4" />
    <circle cx="145" cy="377" r="10" fill="url(#nodeGradPrimary)" />
    <circle cx="145" cy="377" r="3" fill="#ffffff" />
  </g>

  <!-- Node 3: Center Apex Nexus (210, 256) - THE EPISTEMIC FOCAL POINT -->
  <g filter="url(#nexusGlow)">
    <!-- Expanding Halo Pulse Ring -->
    <circle cx="210" cy="256" r="32" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" stroke-dasharray="3,3" />
    <!-- Outer Node Ring -->
    <circle cx="210" cy="256" r="23" fill="#090d16" stroke="#38bdf8" stroke-width="4.5" />
    <!-- Glowing Luminous Nexus Core -->
    <circle cx="210" cy="256" r="13" fill="url(#nodeGradNexus)" />
    <!-- Diamond White Core Sparkle -->
    <circle cx="210" cy="256" r="4.5" fill="#ffffff" />
  </g>
</svg>
